<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FontRig | Workplane</title>
<link rel="stylesheet" href="../css/style.css">
<style>
/* ===================================================================
   Workplane — Self-contained layout
   =================================================================== */
@font-face {
	font-family: 'TypeRig Icons';
	src: url('../assets/fonts/icons/typerig-icons.ttf') format('truetype');
	font-weight: normal;
	font-style: normal;
	font-feature-settings: 'rlig' 1;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
	background: var(--bg-primary);
	color: var(--text-primary);
	font-family: 'DM Sans', 'Inter', 'Segoe UI', sans-serif;
	height: 100vh;
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

/* -- Header --------------------------------------------------- */
.wp-header {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 4px 12px;
	background: var(--bg-secondary);
	border-bottom: 1px solid var(--border);
	flex-shrink: 0;
	height: 32px;
}

.wp-header .logo {
	font-family: 'JetBrains Mono', monospace;
	font-weight: 600;
	font-size: 11px;
	color: var(--accent);
	letter-spacing: 0.5px;
}

.wp-header .wp-title {
	font-size: 11px;
	color: var(--text-dim);
	font-family: 'IBM Plex Mono', monospace;
}

.wp-header .wp-actions {
	margin-left: auto;
	display: flex;
	gap: 4px;
}

.wp-header .wp-btn {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	padding: 3px 8px;
	background: var(--bg-tertiary);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--text-secondary);
	font: 10px 'IBM Plex Mono', monospace;
	cursor: pointer;
	transition: all 0.12s;
}

.wp-header .wp-btn:hover {
	background: var(--bg-hover);
	color: var(--text-primary);
	border-color: var(--accent-dim);
}

.wp-header .wp-btn .tri { font-size: 12px; }

/* -- Main area: panels + add button -------------------------------- */
.wp-body {
	flex: 1;
	display: flex;
	flex-direction: row;
	overflow: hidden;
}

/* -- Panel host: each sidebar lives here --------------------------- */
.wp-panel-host {
	display: flex;
	flex-direction: row;
	flex-shrink: 0;
	overflow: hidden;
	position: relative;
}

/* The sidebar inside a panel host */
.wp-panel-host > .fr-sidebar {
	display: flex !important;  /* always visible in workplane */
	width: 100%;
	min-width: 0;
	border-right: 1px solid var(--border);
}

.wp-panel-host > .fr-sidebar__handle {
	display: block;
}

/* -- Resize handle between panels ---------------------------------- */
.wp-panel-divider {
	width: 5px;
	cursor: col-resize;
	background: var(--border);
	flex-shrink: 0;
	position: relative;
	transition: background 0.12s;
	z-index: 5;
}

.wp-panel-divider:hover,
.wp-panel-divider.dragging {
	background: var(--accent-dim);
}

/* -- Giant + Add Panel button -------------------------------------- */
.wp-add-panel {
	flex: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 16px;
	cursor: pointer;
	background: var(--bg-primary);
	transition: background 0.2s;
	min-width: 120px;
	user-select: none;
}

.wp-add-panel:hover {
	background: var(--bg-secondary);
}

.wp-add-panel__icon {
	width: 72px;
	height: 72px;
	border: 2px dashed var(--border);
	border-radius: 16px;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: all 0.2s;
}

.wp-add-panel:hover .wp-add-panel__icon {
	border-color: var(--accent-dim);
	background: var(--accent-bg);
}

.wp-add-panel__icon .tri {
	font-size: 36px;
	color: var(--text-dim);
	transition: color 0.2s;
}

.wp-add-panel:hover .wp-add-panel__icon .tri {
	color: var(--accent);
}

.wp-add-panel__label {
	font-size: 13px;
	color: var(--text-dim);
	transition: color 0.2s;
}

.wp-add-panel:hover .wp-add-panel__label {
	color: var(--text-secondary);
}

/* -- Disconnected overlay ------------------------------------------ */
#disconnected {
	display: none;
	position: fixed;
	inset: 0;
	background: rgba(0,0,0,0.7);
	z-index: 100;
	justify-content: center;
	align-items: center;
}

#disconnected.visible { display: flex; }

#disconnected .msg {
	background: var(--bg-secondary);
	border: 1px solid var(--border);
	border-radius: 8px;
	padding: 24px 32px;
	text-align: center;
	color: var(--text-secondary);
	font: 13px 'DM Sans', sans-serif;
}
</style>
</head>
<body>

<!-- Header -->
<div class="wp-header">
	<span class="logo">FontRig</span>
	<span class="wp-title" id="wp-title">Workplane</span>
	<div class="wp-actions">
		<button class="wp-btn" id="btn-save-layout" title="Save layout">
			<span class="tri">file_save</span> Save
		</button>
		<button class="wp-btn" id="btn-load-layout" title="Load layout">
			<span class="tri">file_open</span> Load
		</button>
	</div>
</div>

<!-- Body: panels + add button -->
<div class="wp-body" id="wp-body">
	<!-- Panels are inserted here dynamically -->

	<!-- Add Panel button (always at the end) -->
	<div class="wp-add-panel" id="wp-add-btn">
		<div class="wp-add-panel__icon">
			<span class="tri">node_add</span>
		</div>
		<span class="wp-add-panel__label">Add Panel</span>
	</div>
</div>

<!-- Load all required scripts (same as index.html) -->
<script src="../js/geometry/bezier.js"></script>
<script src="../js/core/state.js"></script>
<script src="../js/core/theme.js"></script>
<script src="../js/data/parser.js"></script>
<script src="../js/data/serializer.js"></script>
<script src="../js/data/font.js"></script>
<script src="../js/geometry/geometry.js"></script>
<script src="../js/widgets/fr-widgets.js"></script>
<script src="../js/dialogs/fr-dialogs.js"></script>
<script src="../js/drawing/drawing.js"></script>
<script src="../js/drawing/visualization-layers.js"></script>
<script src="../js/widgets/glyph-widget.js"></script>
<script src="../js/widgets/multi-view.js"></script>
<script src="../js/panels/xml-panel.js"></script>
<script src="../js/panels/sidebar.js"></script>
<script src="../js/panels/sidebar-config.js"></script>
<script src="../js/panels/glyph-renderer.js"></script>
<script src="../js/panels/glyph-widget-panel.js"></script>
<script src="../js/panels/font-info-panel.js"></script>
<script src="../js/panels/detachable-panel.js"></script>
<script src="../js/python/pyodide-bridge.js"></script>
<script src="../js/python/python-panel.js"></script>
<script src="../js/panels/sidebar-init.js"></script>

<!-- Disconnected overlay -->
<div id="disconnected">
	<div class="msg">Main window closed.<br>This workplane will close automatically.</div>
</div>

<script>
'use strict';

console.log('[Workplane] Starting...');

// -- Check for file:// protocol ---------------------------------------
if (window.location.protocol === 'file:') {
	console.error('[Workplane] ERROR: Running on file:// protocol');
	console.error('[Workplane] BroadcastChannel does not work across file:// origins');
	console.error('[Workplane] Please serve FontRig via HTTP: python -m http.server');
	document.body.innerHTML = '<div style="padding:40px;font-family:monospace;background:#220;color:#f88;">' +
		'<h2>Cannot run Workplane from file://</h2>' +
		'<p>BroadcastChannel does not work across file:// origins.</p>' +
		'<p>Please serve FontRig via HTTP:</p>' +
		'<pre>cd /Users/kateliev/Remote/FontRig/editor\npython -m http.server 8000</pre>' +
		'<p>Then open: <a href="http://localhost:8000">http://localhost:8000</a></p>' +
		'</div>';
	throw new Error('Workplane requires HTTP server');
}

// -- Check FontRig loaded ---------------------------------------------
console.log('[Workplane] FontRig:', typeof FontRig);
console.log('[Workplane] FontRig.Sidebar:', typeof FontRig?.Sidebar);
console.log('[Workplane] FontRig.SidebarConfig:', typeof FontRig?.SidebarConfig);

// ===================================================================
// Workplane — Client-side logic
// ===================================================================
// Runs inside the popup workplane window. Communicates with the
// main FontRig window via BroadcastChannel. Each panel is a
// configurable sidebar created using the sidebar framework loaded
// from the main app scripts.
// ===================================================================

// -- Parse URL params -----------------------------------------------
var params = new URLSearchParams(window.location.search);
var workplaneId = params.get('id') || ('wp-' + Date.now());
var channelName = 'trv-workplane-' + workplaneId;

// -- State ----------------------------------------------------------
var state = {
	panels: [],         // array of panel configs
	nextPanelIdx: 0,    // auto-increment panel id counter
	fontData: null,     // cached font state from main window
	isConnected: false,
};

// -- BroadcastChannel to main window --------------------------------
var channel = null;
console.log('[Workplane] Creating BroadcastChannel:', channelName);
try {
	channel = new BroadcastChannel(channelName);
} catch (e) {
	console.warn('BroadcastChannel not available:', e);
}

function send(msg) {
	if (channel) {
		try { channel.postMessage(msg); } catch (e) { console.error('[Workplane] Send error:', e); }
	}
}

// -- Wait for main window to connect ---------------------------------
// We don't rely on window.opener. Instead, we wait for the main
// window to send us initialization data via BroadcastChannel.
var connectionTimeout = null;
var isReady = false;

function showConnecting() {
	var el = document.getElementById('disconnected');
	el.querySelector('.msg').innerHTML = 'Connecting to main window...<br>Please wait.';
	el.classList.add('visible');
}

function showConnected() {
	var el = document.getElementById('disconnected');
	el.classList.remove('visible');
}

function showDisconnected() {
	var el = document.getElementById('disconnected');
	el.querySelector('.msg').innerHTML = 'Main window closed.<br>This workplane will close automatically.';
	el.classList.add('visible');
}

// Show connecting initially
showConnecting();

if (!channel) {
	showDisconnected();
	console.error('[Workplane] BroadcastChannel not available');
} else {
	// Listen for messages from main window
	channel.onmessage = function(e) {
		console.log('[Workplane] onmessage fired:', e.data);
		var msg = e.data;
		console.log('[Workplane] Received:', msg.type);
		
		if (msg.type === 'init') {
			// Received initialization data from main window
			isReady = true;
			state.fontData = msg.fontData;
			state.isConnected = true;
			showConnected();
			
			// Notify main window we're ready
			send({ type: 'workplaneReady', workplaneId: workplaneId });
		}
		
		if (msg.type === 'fontChanged') {
			// Font was changed in main window
			state.fontData = msg.fontData;
			notifyWidgets('fontChanged');
		}
		
		if (msg.type === 'glyphChanged') {
			// Glyph was changed in main window
			notifyWidgets('glyphChanged');
		}
	};
	
	// Tell main window we're here - with a small delay to ensure main window is ready
	setTimeout(function() {
		console.log('[Workplane] Sending workplaneConnect after delay');
		send({ type: 'workplaneConnect', workplaneId: workplaneId });
	}, 500);
	
	// Set timeout - if no init within 5 seconds, show warning
	connectionTimeout = setTimeout(function() {
		if (!isReady) {
			console.warn('[Workplane] No init received from main window within 5s');
			// Still allow manual panel creation - widgets will work with default state
			isReady = true;
			showConnected();
		}
	}, 5000);
}

// -- Notify all widget instances of changes --------------------------
function notifyWidgets(eventType) {
	if (!FontRig || !FontRig.SidebarConfig) return;
	
	var instances = FontRig.SidebarConfig.instances;
	for (var sidebarId in instances) {
		var sidebarInstances = instances[sidebarId];
		for (var widgetId in sidebarInstances) {
			var inst = sidebarInstances[widgetId];
			if (inst && inst.onMainWindowEvent) {
				inst.onMainWindowEvent(eventType);
			}
		}
	}
}

// -- Panel management -----------------------------------------------
var panelCounter = 0;
var panelHosts = [];   // { id, hostEl, sidebar, config }

function addPanel() {
	panelCounter++;
	var panelId = workplaneId + '-panel-' + panelCounter;

	// Create host container
	var host = document.createElement('div');
	host.className = 'wp-panel-host';
	host.id = panelId;
	host.style.width = '320px';

	// Insert before the add button
	var body = document.getElementById('wp-body');
	var addBtn = document.getElementById('wp-add-btn');
	body.insertBefore(host, addBtn);

	// Create a resize divider
	var divider = document.createElement('div');
	divider.className = 'wp-panel-divider';
	body.insertBefore(divider, addBtn);
	wireResize(divider, host);

	// We need a mini container inside for the sidebar framework.
	// The sidebar framework inserts relative to a '#canvas-wrap' child.
	// We create a dummy one so the sidebar prepends correctly.
	var dummyWrap = document.createElement('div');
	dummyWrap.id = 'canvas-wrap';
	dummyWrap.style.display = 'none';
	host.appendChild(dummyWrap);

	// Create a unique sidebar config for this panel.
	// Start with all widgets available but none active (config tab shows).
	var SBC = FontRig.SidebarConfig;
	var allWidgets = SBC.getAllWidgets();
	var widgetList = [];
	for (var i = 0; i < allWidgets.length; i++) {
		widgetList.push({ id: allWidgets[i].id, active: false });
	}

	var configKey = panelId;

	// Register a temporary default config so getConfig works
	SBC.defaults[configKey] = {
		id:           configKey,
		position:     'left',
		tabPosition:  'right',
		defaultWidth: null,
		minWidth:     200,
		maxWidth:     1200,
		widgets:      widgetList,
		defaultTab:   '_config',
	};

	// Create sidebar using the framework (from main window)
	var sidebar = FontRig.Sidebar.createFromConfig(configKey, {
		defaultWidth: '100%',
		container: host,
	});

	if (sidebar) {
		// Force visible (workplane panels are always shown)
		FontRig.Sidebar.show(sidebar);

		// Make the sidebar fill its host
		sidebar.el.style.width = '100%';
		sidebar.el.style.flex = '1';

		// Hide the resize handle (we use panel dividers instead)
		if (sidebar.handleEl) sidebar.handleEl.style.display = 'none';
	}

	var entry = {
		id: panelId,
		hostEl: host,
		dividerEl: divider,
		sidebar: sidebar,
	};

	panelHosts.push(entry);

	// Notify main window
	send({ type: 'panelAdded', panelId: panelId });

	return entry;
}

function removePanel(panelId) {
	for (var i = 0; i < panelHosts.length; i++) {
		if (panelHosts[i].id === panelId) {
			var entry = panelHosts[i];

			// Unmount widgets and clean up sidebar instances
			if (entry.sidebar && entry.sidebar._widgetInstances) {
				var SBC = FontRig.SidebarConfig;
				for (var wid in entry.sidebar._widgetInstances) {
					var widget = SBC.getWidget(wid);
					var inst = SBC.removeInstance(wid, entry.sidebar.id);
					if (widget && widget.unmount && inst) widget.unmount(inst);
				}
				// Remove sidebar from framework registry
				delete FontRig.Sidebar._instances[entry.sidebar.id];
				// Remove config default
				delete SBC.defaults[entry.sidebar.id];
			}

			if (entry.hostEl) entry.hostEl.remove();
			if (entry.dividerEl) entry.dividerEl.remove();

			panelHosts.splice(i, 1);
			break;
		}
	}
}

// -- Panel resize dividers ------------------------------------------
function wireResize(divider, host) {
	var isDragging = false;

	divider.addEventListener('mousedown', function(e) {
		e.preventDefault();
		isDragging = true;
		divider.classList.add('dragging');
		document.body.style.cursor = 'col-resize';
		document.body.style.userSelect = 'none';
	});

	window.addEventListener('mousemove', function(e) {
		if (!isDragging) return;
		var bodyRect = document.getElementById('wp-body').getBoundingClientRect();
		var hostRect = host.getBoundingClientRect();
		var newWidth = e.clientX - hostRect.left;
		newWidth = Math.max(200, Math.min(newWidth, bodyRect.width - 120));
		host.style.width = newWidth + 'px';
	});

	window.addEventListener('mouseup', function() {
		if (isDragging) {
			isDragging = false;
			divider.classList.remove('dragging');
			document.body.style.cursor = '';
			document.body.style.userSelect = '';
		}
	});
}

// ===================================================================
// Layout save / load
// ===================================================================
function getLayout() {
	var layout = {
		_type: 'fontrig-workplane-layout',
		_version: 1,
		workplaneId: workplaneId,
		panels: [],
	};

	for (var i = 0; i < panelHosts.length; i++) {
		var entry = panelHosts[i];
		var panelData = {
			width: entry.hostEl.style.width || '320px',
			widgets: [],
		};

		if (entry.sidebar && entry.sidebar._config) {
			panelData.widgets = entry.sidebar._config.widgets;
		}

		layout.panels.push(panelData);
	}

	return layout;
}

function applyLayout(layout) {
	// Remove existing panels
	while (panelHosts.length > 0) {
		removePanel(panelHosts[0].id);
	}

	// Create panels from layout
	for (var i = 0; i < layout.panels.length; i++) {
		var panelData = layout.panels[i];
		var entry = addPanel();

		// Apply width
		if (panelData.width) {
			entry.hostEl.style.width = panelData.width;
		}

		// Apply widget config
		if (panelData.widgets && panelData.widgets.length > 0 && entry.sidebar) {
			var config = entry.sidebar._config;
			if (config) {
				config.widgets = panelData.widgets;
				FontRig.Sidebar.applyConfig(entry.sidebar, config);

				// Switch to first active widget tab
				var SBC = FontRig.SidebarConfig;
				var activeTabs = SBC.buildTabs(config);
				if (activeTabs.length > 0) {
					FontRig.Sidebar.switchTab(entry.sidebar, activeTabs[0].id);
				}
			}
		}
	}
}

function saveLayout() {
	var layout = getLayout();
	var data = JSON.stringify(layout, null, 2);
	var blob = new Blob([data], { type: 'application/json' });
	var url = URL.createObjectURL(blob);
	var a = document.createElement('a');
	a.href = url;
	a.download = 'workplane-layout.json';
	a.click();
	URL.revokeObjectURL(url);
}

function loadLayout() {
	var input = document.createElement('input');
	input.type = 'file';
	input.accept = '.json';
	input.style.display = 'none';

	input.addEventListener('change', function() {
		if (!input.files || !input.files[0]) return;
		var reader = new FileReader();
		reader.onload = function(e) {
			try {
				var data = JSON.parse(e.target.result);
				if (data._type !== 'fontrig-workplane-layout') {
					console.warn('Invalid workplane layout file');
					return;
				}
				applyLayout(data);
			} catch (err) {
				console.warn('Failed to parse workplane layout:', err);
			}
		};
		reader.readAsText(input.files[0]);
		document.body.removeChild(input);
	});

	document.body.appendChild(input);
	input.click();
}

// ===================================================================
// Message handling from main window
// ===================================================================
function onMessage(msg) {
	if (!msg || !msg.type) return;

	// State broadcasts from main window trigger widget updates
	// Since widgets are mounted via the shared FontRig framework,
	// forEachInstance already covers workplane instances.
	// We mainly need to handle explicit commands here.

	if (msg.type === 'fontChanged') {
		// Font data changed — rebuild all glyph panels
		var SBC = FontRig.SidebarConfig;
		if (SBC) {
			SBC.forEachInstance('glyphs', function(inst) {
				inst.rebuild();
			});
			SBC.forEachInstance('font-info', function(inst) {
				inst.update();
			});
		}
	}

	if (msg.type === 'glyphChanged') {
		var SBC = FontRig.SidebarConfig;
		if (SBC) {
			SBC.forEachInstance('glyphs', function(inst) {
				inst.updateActive();
			});
			SBC.forEachInstance('xml', function(inst) {
				inst.syncFromData();
			});
		}
	}

	if (msg.type === 'applyLayout') {
		if (msg.layout) applyLayout(msg.layout);
	}
}

if (channel) {
	channel.onmessage = function(e) { onMessage(e.data); };
}

// Also accept postMessage fallback
window.addEventListener('message', function(e) {
	if (e.data && e.data.type) onMessage(e.data);
});

// ===================================================================
// Wire UI events
// ===================================================================
document.getElementById('wp-add-btn').addEventListener('click', function() {
	addPanel();
});

document.getElementById('btn-save-layout').addEventListener('click', function() {
	saveLayout();
});

document.getElementById('btn-load-layout').addEventListener('click', function() {
	loadLayout();
});

// ===================================================================
// Connection monitoring
// ===================================================================
var checkInterval = setInterval(function() {
	if (window.opener && window.opener.closed) {
		document.getElementById('disconnected').classList.add('visible');
		clearInterval(checkInterval);
		setTimeout(function() { window.close(); }, 3000);
	}
}, 1000);

window.addEventListener('beforeunload', function() {
	// Clean up all panel sidebar instances from the shared registry
	for (var i = 0; i < panelHosts.length; i++) {
		var entry = panelHosts[i];
		if (entry.sidebar && entry.sidebar._widgetInstances) {
			var SBC = FontRig.SidebarConfig;
			for (var wid in entry.sidebar._widgetInstances) {
				SBC.removeInstance(wid, entry.sidebar.id);
			}
			delete FontRig.Sidebar._instances[entry.sidebar.id];
			delete SBC.defaults[entry.sidebar.id];
		}
	}
	send({ type: 'workplaneClosed', id: workplaneId });
});

// ===================================================================
// Ready — notify main window
// ===================================================================
send({ type: 'workplaneReady', id: workplaneId });

// Set title
document.getElementById('wp-title').textContent = 'Workplane ' + workplaneId.replace('wp-', '#');
document.title = 'FontRig | Workplane ' + workplaneId.replace('wp-', '#');
</script>
</body>
</html>
