<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FontRig | Workplane</title>
<link rel="stylesheet" href="../css/style.css">
<style>
/* ===================================================================
   Workplane — Self-contained layout
   =================================================================== */
@font-face {
	font-family: 'TypeRig Icons';
	src: url('../assets/fonts/icons/typerig-icons.ttf') format('truetype');
	font-weight: normal;
	font-style: normal;
	font-feature-settings: 'rlig' 1;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
	background: var(--bg-primary);
	color: var(--text-primary);
	font-family: 'DM Sans', 'Inter', 'Segoe UI', sans-serif;
	height: 100vh;
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

/* -- Header --------------------------------------------------- */
.wp-header {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 4px 12px;
	background: var(--bg-secondary);
	border-bottom: 1px solid var(--border);
	flex-shrink: 0;
	height: 32px;
}

.wp-header .logo {
	font-family: 'JetBrains Mono', monospace;
	font-weight: 600;
	font-size: 11px;
	color: var(--accent);
	letter-spacing: 0.5px;
}

.wp-header .wp-title {
	font-size: 11px;
	color: var(--text-dim);
	font-family: 'IBM Plex Mono', monospace;
}

.wp-header .wp-actions {
	margin-left: auto;
	display: flex;
	gap: 4px;
}

.wp-header .wp-btn {
	display: inline-flex;
	align-items: center;
	gap: 4px;
	padding: 3px 8px;
	background: var(--bg-tertiary);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--text-secondary);
	font: 10px 'IBM Plex Mono', monospace;
	cursor: pointer;
	transition: all 0.12s;
}

.wp-header .wp-btn:hover {
	background: var(--bg-hover);
	color: var(--text-primary);
	border-color: var(--accent-dim);
}

.wp-header .wp-btn .tri { font-size: 12px; }

/* -- Main area: panels + add button -------------------------------- */
.wp-body {
	flex: 1;
	display: flex;
	flex-direction: row;
	overflow: hidden;
}

/* -- Panel host: each sidebar lives here --------------------------- */
.wp-panel-host {
	display: flex;
	flex-direction: row;
	flex-shrink: 0;
	overflow: hidden;
	position: relative;
}

/* The sidebar inside a panel host */
.wp-panel-host > .fr-sidebar {
	display: flex !important;  /* always visible in workplane */
	width: 100%;
	min-width: 0;
	border-right: 1px solid var(--border);
}

.wp-panel-host > .fr-sidebar__handle {
	display: block;
}

/* -- Resize handle between panels ---------------------------------- */
.wp-panel-divider {
	width: 5px;
	cursor: col-resize;
	background: var(--border);
	flex-shrink: 0;
	position: relative;
	transition: background 0.12s;
	z-index: 5;
}

.wp-panel-divider:hover,
.wp-panel-divider.dragging {
	background: var(--accent-dim);
}

/* -- Giant + Add Panel button -------------------------------------- */
.wp-add-panel {
	flex: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 16px;
	cursor: pointer;
	background: var(--bg-primary);
	transition: background 0.2s;
	min-width: 120px;
	user-select: none;
}

.wp-add-panel:hover {
	background: var(--bg-secondary);
}

.wp-add-panel__icon {
	width: 72px;
	height: 72px;
	border: 2px dashed var(--border);
	border-radius: 16px;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: all 0.2s;
}

.wp-add-panel:hover .wp-add-panel__icon {
	border-color: var(--accent-dim);
	background: var(--accent-bg);
}

.wp-add-panel__icon .tri {
	font-size: 36px;
	color: var(--text-dim);
	transition: color 0.2s;
}

.wp-add-panel:hover .wp-add-panel__icon .tri {
	color: var(--accent);
}

.wp-add-panel__label {
	font-size: 13px;
	color: var(--text-dim);
	transition: color 0.2s;
}

.wp-add-panel:hover .wp-add-panel__label {
	color: var(--text-secondary);
}

/* -- Disconnected overlay ------------------------------------------ */
#disconnected {
	display: none;
	position: fixed;
	inset: 0;
	background: rgba(0,0,0,0.7);
	z-index: 100;
	justify-content: center;
	align-items: center;
}

#disconnected.visible { display: flex; }

#disconnected .msg {
	background: var(--bg-secondary);
	border: 1px solid var(--border);
	border-radius: 8px;
	padding: 24px 32px;
	text-align: center;
	color: var(--text-secondary);
	font: 13px 'DM Sans', sans-serif;
}
</style>
</head>
<body>

<!-- Header -->
<div class="wp-header">
	<span class="logo">FontRig</span>
	<span class="wp-title" id="wp-title">Workplane</span>
	<div class="wp-actions">
		<button class="wp-btn" id="btn-save-layout" title="Save layout">
			<span class="tri">file_save</span> Save
		</button>
		<button class="wp-btn" id="btn-load-layout" title="Load layout">
			<span class="tri">file_open</span> Load
		</button>
	</div>
</div>

<!-- Body: panels + add button -->
<div class="wp-body" id="wp-body">
	<!-- Panels are inserted here dynamically -->

	<!-- Add Panel button (always at the end) -->
	<div class="wp-add-panel" id="wp-add-btn">
		<div class="wp-add-panel__icon">
			<span class="tri">node_add</span>
		</div>
		<span class="wp-add-panel__label">Add Panel</span>
	</div>
</div>

<!-- ================================================================
     Workplane Bootstrap: Share main window's FontRig data
     ================================================================
     Strategy: The main window passes its FontRig reference via
     BroadcastChannel using a "bridge" message containing nothing
     (the popup then accesses the main window via a stored ref).

     Since window.opener may be null in some browsers/configs for
     popup windows, we use a dual approach:
       1. Try window.opener.FontRig (works in most cases)
       2. Fall back to receiving the ref via the main window's
          popup handle (window.open returns the popup ref, and the
          main window sets popup._mainFontRig = FontRig)
       3. If still not available, wait and retry

     The popup loads state.js to create a local FontRig const, then
     bridges data from the main FontRig before other scripts load.
     ================================================================ -->
<!-- Pyodide: Python in WebAssembly (loaded from CDN) -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.4/full/pyodide.js"></script>

<script src="../js/geometry/bezier.js"></script>
<script src="../js/core/state.js"></script>
<script>
// -- Bridge function definition FIRST (before it's called) --
window._workplaneBridgeMain = function(main) {
	'use strict';
	if (FontRig._isWorkplane) return;  // already bridged

	window._mainFontRig = main;
	FontRig._isWorkplane = true;

	// Share live data references — widgets read these directly
	FontRig.state        = main.state;
	FontRig.glyphCache   = main.glyphCache;
	FontRig.dirtyGlyphs  = main.dirtyGlyphs;
	FontRig.workspace    = main.workspace;
	FontRig.GlyphRenderer = main.GlyphRenderer;

	// font and activeGlyph get reassigned on the main FontRig
	// (e.g. FontRig.font = {...}). Use getters so the popup
	// always reads the latest value.
	Object.defineProperty(FontRig, 'font', {
		get: function() { return main.font; },
		set: function(v) { main.font = v; },
		configurable: true,
	});

	Object.defineProperty(FontRig, 'activeGlyph', {
		get: function() { return main.activeGlyph; },
		set: function(v) { main.activeGlyph = v; },
		configurable: true,
	});

	// Share XML line maps
	FontRig.xmlLineNodeMap = main.xmlLineNodeMap;
	FontRig.xmlNodeLineMap = main.xmlNodeLineMap;

	// Share scope and layer selection (created by fr-dialogs.js)
	if (main.layerSelection) FontRig.layerSelection = main.layerSelection;
	if (main.scope) FontRig.scope = main.scope;

	console.log('[Workplane] Bridged! font:', FontRig.font,
		'activeGlyph:', FontRig.activeGlyph);
};

// -- Bridge: share main window's live data with this window's FontRig --
// This runs synchronously before any other script loads.
(function() {
	'use strict';

	// Locate the main window's FontRig. Try every available path.
	function findMainFontRig() {
		// 1. Injected by main window via popup ref
		if (window._mainFontRig) return window._mainFontRig;
		// 2. Standard opener access
		if (window.opener) {
			try {
				if (window.opener.FontRig) return window.opener.FontRig;
			} catch (e) { /* cross-origin block */ }
		}
		return null;
	}

	var main = findMainFontRig();

	if (!main) {
		// The popup may have loaded before the main window set _mainFontRig.
		// Flag that we need deferred bridging (the inline script will handle it).
		console.warn('[Workplane] Main FontRig not available yet — will retry');
		window._workplaneBridgePending = true;
		return;
	}

	window._workplaneBridgeMain(main);
})();
</script>
<script src="../js/core/theme.js"></script>
<script src="../js/data/parser.js"></script>
<script src="../js/data/serializer.js"></script>
<script src="../js/data/font.js"></script>
<script src="../js/geometry/geometry.js"></script>
<script src="../js/widgets/fr-widgets.js"></script>
<script src="../js/dialogs/fr-dialogs.js"></script>
<script src="../js/drawing/drawing.js"></script>
<script src="../js/drawing/visualization-layers.js"></script>
<script src="../js/widgets/glyph-widget.js"></script>
<script src="../js/widgets/multi-view.js"></script>
<script src="../js/interaction/interaction.js"></script>
<script src="../js/panels/xml-panel.js"></script>
<script src="../js/panels/sidebar.js"></script>
<script src="../js/panels/sidebar-config.js"></script>
<script src="../js/panels/glyph-renderer.js"></script>
<script src="../js/panels/glyph-widget-panel.js"></script>
<script src="../js/panels/font-info-panel.js"></script>
<script src="../js/panels/detachable-panel.js"></script>

<script src="../js/python/python-panel.js"></script>
<script src="../js/panels/sidebar-init.js"></script>

<!-- Disconnected overlay -->
<div id="disconnected">
	<div class="msg">Main window closed.<br>This workplane will close automatically.</div>
</div>

<script>
'use strict';

// ===================================================================
// Workplane — Client-side logic
// ===================================================================
// Runs inside the popup workplane window. Data is shared with the
// main window via window.opener (the bootstrap script above bridges
// FontRig.state, FontRig.font, etc. as live references).
//
// BroadcastChannel is used only for lightweight refresh notifications
// from the main window ("font changed", "glyph changed" — go refresh
// your widgets"). No data payloads are sent — widgets read directly
// from the shared FontRig object.
// ===================================================================

console.log('[Workplane] Starting...');

// -- Check prerequisites -----------------------------------------------
if (window.location.protocol === 'file:') {
	document.body.innerHTML = '<div style="padding:40px;font-family:monospace;background:#220;color:#f88;">' +
		'<h2>Cannot run Workplane from file://</h2>' +
		'<p>Please serve FontRig via HTTP:</p>' +
		'<pre>python -m http.server 8000</pre>' +
		'<p>Then open: <a href="http://localhost:8000">http://localhost:8000</a></p>' +
		'</div>';
	throw new Error('Workplane requires HTTP server');
}

// -- Deferred bridge retry --------------------------------------------
// If the bootstrap couldn't bridge (window.opener was null and
// _mainFontRig wasn't injected yet), the main window is actively
// retrying injection via its popup reference. Try again here in case
// it arrived between the bootstrap <script> and this one.
if (!FontRig._isWorkplane) {
	var main = window._mainFontRig || null;
	if (!main && window.opener) {
		try { main = window.opener.FontRig; } catch (e) {}
	}

	if (main) {
		window._workplaneBridgeMain(main);
		console.log('[Workplane] Deferred bridge succeeded');
	} else {
		// Still not available — the main window's injection timer will
		// call _workplaneBridgeMain() when it succeeds. For now, show
		// a "connecting" message and disable panel creation.
		console.warn('[Workplane] Bridge still pending — main window will inject');
	}
}

console.log('[Workplane] FontRig bridged:', !!FontRig._isWorkplane);
if (FontRig._isWorkplane) {
	console.log('[Workplane] FontRig.font:', FontRig.font);
	console.log('[Workplane] FontRig.Sidebar:', typeof FontRig.Sidebar);
	console.log('[Workplane] FontRig.SidebarConfig:', typeof FontRig.SidebarConfig);
}

// -- Parse URL params -----------------------------------------------
var params = new URLSearchParams(window.location.search);
var workplaneId = params.get('id') || ('wp-' + Date.now());
var channelName = 'trv-workplane-' + workplaneId;

// -- BroadcastChannel for refresh notifications ---------------------
var channel = null;
try {
	channel = new BroadcastChannel(channelName);
} catch (e) {
	console.warn('[Workplane] BroadcastChannel not available:', e);
}

function send(msg) {
	if (channel) {
		try { channel.postMessage(msg); }
		catch (e) { console.error('[Workplane] Send error:', e); }
	}
}

// ===================================================================
// Handle refresh notifications from main window
// ===================================================================
// Data is already shared via window.opener — these messages just
// tell us "something changed, refresh your widgets".
// ===================================================================
function onRefresh(msg) {
	if (!msg || !msg.type) return;
	console.log('[Workplane] Refresh:', msg.type);

	var SBC = FontRig.SidebarConfig;
	if (!SBC) return;

	if (msg.type === 'fontChanged') {
		// Font opened/changed — rebuild glyph list and font info
		SBC.forEachInstance('glyphs', function(inst) {
			if (inst.rebuild) inst.rebuild();
		});
		SBC.forEachInstance('font-info', function(inst) {
			if (inst.update) inst.update();
		});
	}

	if (msg.type === 'glyphChanged') {
		// Active glyph changed — update highlights, dirty state, and XML
		SBC.forEachInstance('glyphs', function(inst) {
			if (inst.updateActive) inst.updateActive();
			if (inst.updateDirty) inst.updateDirty();
		});
		SBC.forEachInstance('xml', function(inst) {
			if (inst.syncFromData) inst.syncFromData();
		});
	}

	if (msg.type === 'applyLayout') {
		if (msg.layout) applyLayout(msg.layout);
	}
}

if (channel) {
	channel.onmessage = function(e) { onRefresh(e.data); };

	// Tell main window we're alive (for handshake)
	setTimeout(function() {
		send({ type: 'workplaneReady', workplaneId: workplaneId });
	}, 100);
}

// -- Overlay helpers -------------------------------------------------
function showDisconnected() {
	var el = document.getElementById('disconnected');
	el.querySelector('.msg').innerHTML = 'Main window closed.<br>This workplane will close automatically.';
	el.classList.add('visible');
}

// -- Panel management -----------------------------------------------
var panelCounter = 0;
var panelHosts = [];   // { id, hostEl, sidebar, dividerEl }

function addPanel() {
	panelCounter++;
	var panelId = workplaneId + '-panel-' + panelCounter;

	// Create host container
	var host = document.createElement('div');
	host.className = 'wp-panel-host';
	host.id = panelId;
	host.style.width = '320px';

	// Insert before the add button
	var body = document.getElementById('wp-body');
	var addBtn = document.getElementById('wp-add-btn');
	body.insertBefore(host, addBtn);

	// Create a resize divider
	var divider = document.createElement('div');
	divider.className = 'wp-panel-divider';
	body.insertBefore(divider, addBtn);
	wireResize(divider, host);

	// Dummy canvas-wrap for sidebar framework's DOM insertion logic
	var dummyWrap = document.createElement('div');
	dummyWrap.id = 'canvas-wrap';
	dummyWrap.style.display = 'none';
	host.appendChild(dummyWrap);

	// Build sidebar config: all widgets available, none active initially
	var SBC = FontRig.SidebarConfig;
	var allWidgets = SBC.getAllWidgets();
	var widgetList = [];
	for (var i = 0; i < allWidgets.length; i++) {
		widgetList.push({ id: allWidgets[i].id, active: false });
	}

	SBC.defaults[panelId] = {
		id:           panelId,
		position:     'left',
		tabPosition:  'right',
		defaultWidth: null,
		minWidth:     200,
		maxWidth:     1200,
		widgets:      widgetList,
		defaultTab:   '_config',
	};

	// Create sidebar (DOM created in this popup's document)
	var sidebar = FontRig.Sidebar.createFromConfig(panelId, {
		defaultWidth: '100%',
		container: host,
	});

	if (sidebar) {
		FontRig.Sidebar.show(sidebar);
		sidebar.el.style.width = '100%';
		sidebar.el.style.flex = '1';
		if (sidebar.handleEl) sidebar.handleEl.style.display = 'none';
	}

	var entry = {
		id: panelId,
		hostEl: host,
		dividerEl: divider,
		sidebar: sidebar,
	};

	panelHosts.push(entry);
	send({ type: 'panelAdded', panelId: panelId });
	return entry;
}

function removePanel(panelId) {
	for (var i = 0; i < panelHosts.length; i++) {
		if (panelHosts[i].id === panelId) {
			var entry = panelHosts[i];

			if (entry.sidebar && entry.sidebar._widgetInstances) {
				var SBC = FontRig.SidebarConfig;
				for (var wid in entry.sidebar._widgetInstances) {
					var widget = SBC.getWidget(wid);
					var inst = SBC.removeInstance(wid, entry.sidebar.id);
					if (widget && widget.unmount && inst) widget.unmount(inst);
				}
				delete FontRig.Sidebar._instances[entry.sidebar.id];
				delete SBC.defaults[entry.sidebar.id];
			}

			if (entry.hostEl) entry.hostEl.remove();
			if (entry.dividerEl) entry.dividerEl.remove();

			panelHosts.splice(i, 1);
			break;
		}
	}
}

// -- Panel resize dividers ------------------------------------------
function wireResize(divider, host) {
	var isDragging = false;

	divider.addEventListener('mousedown', function(e) {
		e.preventDefault();
		isDragging = true;
		divider.classList.add('dragging');
		document.body.style.cursor = 'col-resize';
		document.body.style.userSelect = 'none';
	});

	window.addEventListener('mousemove', function(e) {
		if (!isDragging) return;
		var bodyRect = document.getElementById('wp-body').getBoundingClientRect();
		var hostRect = host.getBoundingClientRect();
		var newWidth = e.clientX - hostRect.left;
		newWidth = Math.max(200, Math.min(newWidth, bodyRect.width - 120));
		host.style.width = newWidth + 'px';
	});

	window.addEventListener('mouseup', function() {
		if (isDragging) {
			isDragging = false;
			divider.classList.remove('dragging');
			document.body.style.cursor = '';
			document.body.style.userSelect = '';
		}
	});
}

// ===================================================================
// Layout save / load
// ===================================================================
function getLayout() {
	var layout = {
		_type: 'fontrig-workplane-layout',
		_version: 1,
		workplaneId: workplaneId,
		panels: [],
	};

	for (var i = 0; i < panelHosts.length; i++) {
		var entry = panelHosts[i];
		var panelData = {
			width: entry.hostEl.style.width || '320px',
			widgets: [],
		};

		if (entry.sidebar && entry.sidebar._config) {
			panelData.widgets = entry.sidebar._config.widgets;
		}

		layout.panels.push(panelData);
	}

	return layout;
}

function applyLayout(layout) {
	while (panelHosts.length > 0) {
		removePanel(panelHosts[0].id);
	}

	for (var i = 0; i < layout.panels.length; i++) {
		var panelData = layout.panels[i];
		var entry = addPanel();

		if (panelData.width) {
			entry.hostEl.style.width = panelData.width;
		}

		if (panelData.widgets && panelData.widgets.length > 0 && entry.sidebar) {
			var config = entry.sidebar._config;
			if (config) {
				config.widgets = panelData.widgets;
				FontRig.Sidebar.applyConfig(entry.sidebar, config);

				var SBC = FontRig.SidebarConfig;
				var activeTabs = SBC.buildTabs(config);
				if (activeTabs.length > 0) {
					FontRig.Sidebar.switchTab(entry.sidebar, activeTabs[0].id);
				}
			}
		}
	}
}

function saveLayout() {
	var layout = getLayout();
	var data = JSON.stringify(layout, null, 2);
	var blob = new Blob([data], { type: 'application/json' });
	var url = URL.createObjectURL(blob);
	var a = document.createElement('a');
	a.href = url;
	a.download = 'workplane-layout.json';
	a.click();
	URL.revokeObjectURL(url);
}

function loadLayout() {
	var input = document.createElement('input');
	input.type = 'file';
	input.accept = '.json';
	input.style.display = 'none';

	input.addEventListener('change', function() {
		if (!input.files || !input.files[0]) return;
		var reader = new FileReader();
		reader.onload = function(e) {
			try {
				var data = JSON.parse(e.target.result);
				if (data._type !== 'fontrig-workplane-layout') {
					console.warn('Invalid workplane layout file');
					return;
				}
				applyLayout(data);
			} catch (err) {
				console.warn('Failed to parse workplane layout:', err);
			}
		};
		reader.readAsText(input.files[0]);
		document.body.removeChild(input);
	});

	document.body.appendChild(input);
	input.click();
}

// ===================================================================
// Wire UI events
// ===================================================================
document.getElementById('wp-add-btn').addEventListener('click', addPanel);
document.getElementById('btn-save-layout').addEventListener('click', saveLayout);
document.getElementById('btn-load-layout').addEventListener('click', loadLayout);

// Listen for close panel events from config panel
document.addEventListener('workplanePanelClose', function(e) {
	var panelId = e.detail.panelId;
	console.log('[Workplane] Closing panel:', panelId);
	removePanel(panelId);
});

// ===================================================================
// Connection monitoring
// ===================================================================
// Monitor main window — check both opener and _mainFontRig source
var checkInterval = setInterval(function() {
	var mainClosed = false;

	// Check via window.opener if available
	if (window.opener) {
		mainClosed = window.opener.closed;
	}

	// Check if the bridged FontRig's font property throws (window gone)
	if (!mainClosed && window._mainFontRig) {
		try {
			// Access a property — if main window is closed, this throws
			var _test = window._mainFontRig.state;
			if (_test === undefined) mainClosed = true;
		} catch (e) {
			mainClosed = true;
		}
	}

	if (mainClosed) {
		showDisconnected();
		clearInterval(checkInterval);
		setTimeout(function() { window.close(); }, 3000);
	}
}, 2000);

window.addEventListener('beforeunload', function() {
	for (var i = 0; i < panelHosts.length; i++) {
		var entry = panelHosts[i];
		if (entry.sidebar && entry.sidebar._widgetInstances) {
			var SBC = FontRig.SidebarConfig;
			for (var wid in entry.sidebar._widgetInstances) {
				SBC.removeInstance(wid, entry.sidebar.id);
			}
			delete FontRig.Sidebar._instances[entry.sidebar.id];
			delete SBC.defaults[entry.sidebar.id];
		}
	}
	send({ type: 'workplaneClosed', id: workplaneId });
});

// Set title
document.getElementById('wp-title').textContent = 'Workplane ' + workplaneId.replace('wp-', '#');
document.title = 'FontRig | Workplane ' + workplaneId.replace('wp-', '#');

console.log('[Workplane] Ready. ID:', workplaneId, 'Font:', FontRig.font ? 'loaded' : 'none');

// -- Override switchGlyph to notify main window --
// This must run AFTER all scripts are loaded (hence at the end of the file).
// In workplane, clicking a glyph should switch it in the main window,
// not locally (which fails due to missing DOM elements).
if (FontRig._isWorkplane && FontRig.switchGlyph) {
	var origSwitchGlyph = FontRig.switchGlyph;
	FontRig.switchGlyph = async function(name) {
		console.log('[Workplane] Sending selectGlyph to main:', name);
		send({ type: 'selectGlyph', glyphName: name });
		// Don't call origSwitchGlyph locally - the main window will handle it
	};
}
</script>
</body>
</html>
