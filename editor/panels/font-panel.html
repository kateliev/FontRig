<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TR:EDIT | Font Panel</title>
<link rel="stylesheet" href="../css/style.css">
<style>
	@font-face {
		font-family: 'TypeRig Icons';
		src: url('../assets/fonts/icons/typerig-icons.ttf') format('truetype');
		font-weight: normal;
		font-style: normal;
		font-feature-settings: 'rlig' 1;
	}

	:root {
		--bg-primary: #1a1a1e;
		--bg-secondary: #222226;
		--bg-tertiary: #2a2a2e;
		--bg-hover: #2e2e34;
		--text-primary: #e8e8ec;
		--text-secondary: #a8a8b0;
		--text-dim: #666670;
		--border: #333338;
		--border-subtle: #2a2a30;
		--accent: #5b9def;
		--accent-dim: #3a5a8a;
		--accent-bg: rgba(91,157,239,0.12);
	}

	* { margin: 0; padding: 0; box-sizing: border-box; }

	body {
		background: var(--bg-primary);
		color: var(--text-primary);
		font-family: 'DM Sans', 'Inter', 'Segoe UI', sans-serif;
		height: 100vh;
		display: flex;
		flex-direction: column;
		overflow: hidden;
	}

	.tri {
		font-family: 'TypeRig Icons';
		font-size: 14px;
		line-height: 1;
		font-style: normal;
		font-weight: normal;
	}

	/* -- Header --------------------------------------------------- */
	#panel-header {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 6px 12px;
		background: var(--bg-secondary);
		border-bottom: 1px solid var(--border);
	}

	#panel-header .logo {
		font-family: 'JetBrains Mono', monospace;
		font-weight: 600;
		font-size: 11px;
		color: var(--accent);
		letter-spacing: 0.5px;
	}

	.panel-tab {
		padding: 4px 10px;
		background: transparent;
		border: 1px solid transparent;
		border-radius: 4px;
		color: var(--text-dim);
		font-family: 'DM Sans', sans-serif;
		font-size: 12px;
		cursor: pointer;
	}

	.panel-tab:hover { color: var(--text-secondary); }
	.panel-tab.active {
		background: var(--accent-bg);
		color: var(--accent);
		border-color: var(--accent-dim);
	}

	.panel-popout {
		margin-left: auto;
		padding: 4px 8px;
		background: transparent;
		border: none;
		border-radius: 4px;
		color: var(--text-dim);
		cursor: pointer;
	}

	.panel-popout:hover {
		background: var(--bg-hover);
		color: var(--text-secondary);
	}

	.panel-info {
		margin-left: 8px;
		font: 10px 'JetBrains Mono', monospace;
		color: var(--text-dim);
	}

	/* -- Content -------------------------------------------------- */
	#panel-body {
		flex: 1;
		display: flex;
		flex-direction: column;
		overflow: hidden;
	}

	.panel-content {
		display: none;
		flex: 1;
		flex-direction: column;
		overflow: hidden;
	}

	.panel-content.active {
		display: flex;
	}

	/* -- Font Info tab -------------------------------------------- */
	#font-info-tab {
		padding: 12px;
		overflow-y: auto;
		font-size: 12px;
	}

	.font-info-title {
		font-size: 16px;
		font-weight: 600;
		margin-bottom: 12px;
		color: var(--text-primary);
	}

	.font-info-section {
		margin-bottom: 16px;
	}

	.font-info-section h4 {
		font-size: 11px;
		text-transform: uppercase;
		letter-spacing: 0.5px;
		color: var(--text-dim);
		margin-bottom: 6px;
		border-bottom: 1px solid var(--border-subtle);
		padding-bottom: 4px;
	}

	.font-info-row {
		display: flex;
		justify-content: space-between;
		padding: 3px 0;
	}

	.font-info-row .label {
		color: var(--text-secondary);
	}

	.font-info-row .value {
		color: var(--text-primary);
		font-family: 'JetBrains Mono', monospace;
	}

	/* -- Glyph Thumbnail tab --------------------------------------- */
	#glyph-tab {
		display: flex;
		flex-direction: column;
		flex: 1;
		overflow: hidden;
	}

	#glyph-search-wrap {
		padding: 8px;
		border-bottom: 1px solid var(--border-subtle);
	}

	#glyph-search {
		width: 100%;
		padding: 6px 10px;
		background: var(--bg-tertiary);
		border: 1px solid var(--border);
		border-radius: 4px;
		color: var(--text-primary);
		font-size: 12px;
		outline: none;
	}

	#glyph-search:focus {
		border-color: var(--accent-dim);
	}

	#glyph-list {
		flex: 1;
		overflow-y: auto;
		padding: 4px;
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
		gap: 4px;
		align-content: start;
	}

	.glyph-entry {
		display: flex;
		flex-direction: column;
		align-items: center;
		padding: 6px 4px;
		border-radius: 4px;
		cursor: pointer;
		transition: background 0.15s;
	}

	.glyph-entry:hover {
		background: var(--bg-hover);
	}

	.glyph-entry.active {
		background: var(--accent-bg);
		border: 1px solid var(--accent-dim);
	}

	.glyph-entry canvas {
		width: 48px;
		height: 64px;
	}

	.glyph-entry-name {
		font-size: 10px;
		color: var(--text-secondary);
		margin-top: 4px;
		text-align: center;
		max-width: 100%;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	/* -- No font loaded ------------------------------------------- */
	#no-font {
		display: flex;
		flex: 1;
		align-items: center;
		justify-content: center;
		color: var(--text-dim);
		font-size: 13px;
	}

	/* -- Disconnected overlay ------------------------------------- */
	#disconnected {
		display: none;
		position: fixed;
		inset: 0;
		background: rgba(0,0,0,0.7);
		z-index: 100;
		justify-content: center;
		align-items: center;
	}

	#disconnected.visible { display: flex; }

	#disconnected .msg {
		background: var(--bg-secondary);
		border: 1px solid var(--border);
		border-radius: 8px;
		padding: 24px 32px;
		text-align: center;
		color: var(--text-secondary);
		font: 13px 'DM Sans', sans-serif;
	}
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div id="panel-header">
	<span class="logo">TR:FONT</span>
	<button class="panel-tab active" data-panel="info">Info</button>
	<button class="panel-tab" data-panel="glyphs">Glyphs</button>
	<button class="panel-popout" id="btn-popout" title="Close panel">
		<span class="tri">arrows_expand</span>
	</button>
	<span class="panel-info" id="glyph-count"></span>
</div>

<div id="panel-body">
	<!-- Font Info tab -->
	<div id="font-info-tab" class="panel-content active">
		<div id="font-info-content">
			<div id="no-font">No font loaded</div>
		</div>
	</div>

	<!-- Glyph Thumbnails tab -->
	<div id="glyph-tab" class="panel-content">
		<div id="glyph-search-wrap">
			<input type="text" id="glyph-search" placeholder="Filter glyphs..." spellcheck="false" autocomplete="off">
		</div>
		<div id="glyph-list"></div>
	</div>
</div>

<div id="disconnected">
	<div class="msg">Main window closed.<br>This panel will close automatically.</div>
</div>

<script>
'use strict';

var CHANNEL_NAME = 'trv-font-panel-bridge';
var channel = null;
var glyphList = [];
var currentGlyph = null;
var thumbQueue = [];
var thumbRunning = false;

// -- BroadcastChannel -----------------------------------------------
try {
	channel = new BroadcastChannel(CHANNEL_NAME);
} catch (e) {
	console.warn('BroadcastChannel not available, falling back to opener');
}

function send(msg) {
	if (channel) {
		channel.postMessage(msg);
	} else if (window.opener) {
		window.opener.postMessage(msg, '*');
	}
}

function onMessage(msg) {
	if (msg.type === 'fontUpdate') {
		renderFontInfo(msg.fontInfo);
		renderGlyphList(msg.glyphList, msg.currentGlyph);
		if (msg.glyphCount !== undefined) {
			document.getElementById('glyph-count').textContent = msg.glyphCount + ' glyphs';
		}
	} else if (msg.type === 'glyphSelected') {
		setActiveGlyph(msg.glyphName);
	} else if (msg.type === 'thumbnail') {
		receiveThumbnail(msg.name, msg.data);
	}
}

if (channel) {
	channel.onmessage = function(e) { onMessage(e.data); };
}

window.addEventListener('message', function(e) {
	if (e.data && e.data.type) onMessage(e.data);
});

// Notify main window we're ready
send({ type: 'panelReady' });

// -- Popout button ------------------------------------------------
document.getElementById('btn-popout').addEventListener('click', function() {
	window.close();
});

// -- Tab switching --------------------------------------------------
var tabs = document.querySelectorAll('.panel-tab');
for (var i = 0; i < tabs.length; i++) {
	tabs[i].addEventListener('click', function() {
		for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
		this.classList.add('active');
		var panel = this.dataset.panel;
		document.getElementById('font-info-tab').classList.toggle('active', panel === 'info');
		document.getElementById('glyph-tab').classList.toggle('active', panel === 'glyphs');
	});
}

// -- Render Font Info ----------------------------------------------
function renderFontInfo(info) {
	var container = document.getElementById('font-info-content');
	if (!info) {
		container.innerHTML = '<div id="no-font">No font loaded</div>';
		return;
	}

	var html = '<div class="font-info-title">' + (info.familyName || 'Unknown Font') + '</div>';

	// Basic Info
	html += '<div class="font-info-section"><h4>Basic</h4>';
	if (info.styleName) {
		html += '<div class="font-info-row"><span class="label">Style</span><span class="value">' + info.styleName + '</span></div>';
	}
	if (info.version) {
		html += '<div class="font-info-row"><span class="label">Version</span><span class="value">' + info.version + '</span></div>';
	}
	html += '</div>';

	// Metrics
	html += '<div class="font-info-section"><h4>Metrics</h4>';
	if (info.upm) {
		html += '<div class="font-info-row"><span class="label">UPM</span><span class="value">' + info.upm + '</span></div>';
	}
	if (info.ascender) {
		html += '<div class="font-info-row"><span class="label">Ascender</span><span class="value">' + info.ascender + '</span></div>';
	}
	if (info.descender) {
		html += '<div class="font-info-row"><span class="label">Descender</span><span class="value">' + info.descender + '</span></div>';
	}
	if (info.xHeight) {
		html += '<div class="font-info-row"><span class="label">x-Height</span><span class="value">' + info.xHeight + '</span></div>';
	}
	if (info.capHeight) {
		html += '<div class="font-info-row"><span class="label">Cap-Height</span><span class="value">' + info.capHeight + '</span></div>';
	}
	html += '</div>';

	// Masters
	if (info.masters && info.masters.length > 0) {
		html += '<div class="font-info-section"><h4>Masters</h4>';
		for (var i = 0; i < info.masters.length; i++) {
			var m = info.masters[i];
			html += '<div class="font-info-row"><span class="label">' + m.name + '</span><span class="value">' + m.axisValues + '</span></div>';
		}
		html += '</div>';
	}

	container.innerHTML = html;
}

// -- Render Glyph List ---------------------------------------------
function renderGlyphList(list, activeGlyph) {
	glyphList = list || [];
	var container = document.getElementById('glyph-list');
	container.innerHTML = '';

	for (var i = 0; i < glyphList.length; i++) {
		var g = glyphList[i];
		var div = document.createElement('div');
		div.className = 'glyph-entry';
		div.dataset.name = g.name;

		if (g.name === activeGlyph) {
			div.classList.add('active');
		}

		// Thumbnail canvas
		var cvs = document.createElement('canvas');
		cvs.width = 48;
		cvs.height = 64;
		cvs.dataset.name = g.name;
		div.appendChild(cvs);

		var nameSpan = document.createElement('span');
		nameSpan.className = 'glyph-entry-name';
		nameSpan.textContent = g.name;
		div.appendChild(nameSpan);

		container.appendChild(div);

		// Request thumbnail from main window
		requestThumbnail(g.name);
	}
}

function requestThumbnail(name) {
	// Skip if already requested
	var el = document.querySelector('.glyph-entry[data-name="' + name + '"] canvas');
	if (!el || el.dataset.requested) return;
	el.dataset.requested = 'true';
	
	thumbQueue.push(name);
	processThumbQueue();
}

function processThumbQueue() {
	if (thumbRunning || thumbQueue.length === 0) return;
	thumbRunning = true;

	while (thumbQueue.length > 0) {
		var name = thumbQueue.shift();
		send({ type: 'requestThumbnail', name: name });
	}

	thumbRunning = false;
}

function receiveThumbnail(name, dataUrl) {
	var el = document.querySelector('.glyph-entry[data-name="' + name + '"] canvas');
	if (!el) return;

	var img = new Image();
	img.onload = function() {
		var ctx = el.getContext('2d');
		ctx.drawImage(img, 0, 0);
	};
	img.src = dataUrl;
}

function setActiveGlyph(glyphName) {
	currentGlyph = glyphName;
	var entries = document.querySelectorAll('.glyph-entry');
	for (var i = 0; i < entries.length; i++) {
		entries[i].classList.toggle('active', entries[i].dataset.name === glyphName);
	}
}

// -- Glyph click --------------------------------------------------
document.getElementById('glyph-list').addEventListener('click', function(e) {
	var entry = e.target.closest('.glyph-entry');
	if (entry) {
		var name = entry.dataset.name;
		send({ type: 'selectGlyph', glyphName: name });
	}
});

// -- Search -------------------------------------------------------
var searchInput = document.getElementById('glyph-search');
searchInput.addEventListener('input', function() {
	var query = this.value.toLowerCase();
	var entries = document.querySelectorAll('.glyph-entry');
	for (var i = 0; i < entries.length; i++) {
		var name = entries[i].dataset.name;
		entries[i].style.display = name.toLowerCase().includes(query) ? '' : 'none';
	}
});

// -- Connection monitoring ------------------------------------------
var checkInterval = setInterval(function() {
	if (window.opener && window.opener.closed) {
		document.getElementById('disconnected').classList.add('visible');
		clearInterval(checkInterval);
		setTimeout(function() { window.close(); }, 2000);
	}
}, 1000);

window.addEventListener('beforeunload', function() {
	send({ type: 'panelClosed' });
});
</script>
</body>
</html>
