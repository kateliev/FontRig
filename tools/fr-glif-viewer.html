<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FontRig · Glyph Viewer</title>
<link rel="icon" href="../editor/favicon.svg">
<style>
/* Reuse the FontRig editor design tokens so this matches the app.
   Kept inline so the tool is a single independent file. */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap');

:root {
	--bg-primary: #1a1a1e;
	--bg-secondary: #222226;
	--bg-tertiary: #2a2a2e;
	--bg-hover: #333338;
	--border: #3a3a40;
	--border-subtle: #2e2e34;
	--text-primary: #e8e8ec;
	--text-secondary: #9898a0;
	--text-dim: #686870;
	--accent: #5b9def;
	--accent-bg: rgba(91,157,239,0.08);
	--outline-fill: rgba(200,200,210,0.12);
	--outline-stroke: #c8c8d2;
	--danger: #ff6b6b;
	--mono: 'IBM Plex Mono', monospace;
}
[data-theme="light"] {
	--bg-primary: #fafafa;
	--bg-secondary: #ffffff;
	--bg-tertiary: #f0f0f0;
	--bg-hover: #e5e5e5;
	--border: #d0d0d0;
	--border-subtle: #e5e5e5;
	--text-primary: #383a42;
	--text-secondary: #696c77;
	--text-dim: #a0a1a7;
	--accent: #4078f2;
	--accent-bg: rgba(64,120,242,0.08);
	--outline-fill: rgba(56,58,66,0.08);
	--outline-stroke: #383a42;
	--danger: #e45649;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
	font-family: 'DM Sans', sans-serif;
	background: var(--bg-primary);
	color: var(--text-primary);
	min-height: 100vh;
	-webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* -- Header / toolbar -- */
header {
	display: flex;
	align-items: center;
	gap: 16px;
	flex-wrap: wrap;
	padding: 12px 20px;
	background: var(--bg-secondary);
	border-bottom: 1px solid var(--border);
	position: sticky;
	top: 0;
	z-index: 10;
}
h1 {
	font-size: 15px;
	font-weight: 600;
	letter-spacing: 0.3px;
}
h1 .dim { color: var(--text-dim); font-weight: 400; }
.spacer { flex: 1; }

.btn {
	font-family: inherit;
	font-size: 13px;
	font-weight: 500;
	color: var(--text-primary);
	background: var(--bg-tertiary);
	border: 1px solid var(--border);
	border-radius: 6px;
	padding: 7px 14px;
	cursor: pointer;
	transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--bg-hover); border-color: var(--accent); }
.btn.primary { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.count { font-size: 12px; color: var(--text-secondary); }

label.size {
	display: flex; align-items: center; gap: 8px;
	font-size: 12px; color: var(--text-secondary);
}
input[type=range] { accent-color: var(--accent); width: 110px; }

/* -- Layer dropdowns -- */
select {
	font-family: var(--mono);
	font-size: 12px;
	color: var(--text-primary);
	background: var(--bg-tertiary);
	border: 1px solid var(--border);
	border-radius: 6px;
	padding: 6px 8px;
	cursor: pointer;
	max-width: 100%;
}
select:hover { border-color: var(--accent); }
#globalLayer { color: var(--accent); }
.layer-bar { padding: 8px 11px 0; }
.layer-pick { width: 100%; font-size: 11px; padding: 4px 6px; }

/* -- Dropzone -- */
#dropzone {
	margin: 20px;
	border: 2px dashed var(--border);
	border-radius: 10px;
	padding: 40px 20px;
	text-align: center;
	color: var(--text-secondary);
	transition: border-color 0.15s, background 0.15s;
}
#dropzone.hot { border-color: var(--accent); background: var(--accent-bg); color: var(--text-primary); }
#dropzone .big { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
#dropzone .small { font-size: 12px; color: var(--text-dim); }

/* -- Grid of glyph cards -- */
#grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(var(--card, 180px), 1fr));
	gap: 14px;
	padding: 0 20px 40px;
}
.card {
	background: var(--bg-secondary);
	border: 1px solid var(--border-subtle);
	border-radius: 8px;
	overflow: hidden;
	display: flex;
	flex-direction: column;
}
.render {
	background: var(--bg-tertiary);
	border-bottom: 1px solid var(--border-subtle);
	aspect-ratio: 1 / 1;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 10px;
}
.render svg { width: 100%; height: 100%; display: block; }
.render.empty { color: var(--text-dim); font-size: 12px; font-style: italic; }
.render.error { color: var(--danger); font-size: 11px; text-align: center; padding: 14px; font-family: var(--mono); overflow: auto; }

.meta { padding: 9px 11px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fname {
	font-family: var(--mono);
	font-size: 12px;
	font-weight: 500;
	color: var(--text-primary);
	word-break: break-all;
}
.fpath {
	font-family: var(--mono);
	font-size: 10px;
	color: var(--text-dim);
	word-break: break-all;
	line-height: 1.4;
}
.info { font-size: 10.5px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.info b { color: var(--text-primary); font-weight: 600; }
.info .fmt { color: var(--accent); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.2px; }
.warn { font-size: 10px; color: var(--danger); margin-top: 2px; }
</style>
</head>
<body>
<header>
	<h1>FontRig <span class="dim">· Glyph Viewer</span></h1>
	<span class="count" id="count">no files</span>
	<div class="spacer"></div>
	<span id="globalLayerWrap" hidden>
		<select id="globalLayer" title="Layer for all .trglyph cards"><option value="">Layer: first</option></select>
	</span>
	<label class="size">size
		<input type="range" id="sizeRange" min="90" max="320" value="180" step="10">
	</label>
	<button class="btn primary" id="pick">Select files…</button>
	<button class="btn" id="clear">Clear</button>
	<button class="btn" id="theme" title="Toggle light/dark">◑</button>
	<input type="file" id="file" accept=".glif,.trglyph,application/xml,text/xml" multiple hidden>
</header>

<div id="dropzone">
	<div class="big">Drop .glif or .trglyph files or a folder here</div>
	<div class="small">Each file is rendered on its own — no font assembly, no .plist lookups. UFO components are not resolved; .trglyph shows its first layer.</div>
</div>

<div id="grid"></div>

<script>
'use strict';

const grid = document.getElementById('grid');
const dropzone = document.getElementById('dropzone');
const countEl = document.getElementById('count');
const fileInput = document.getElementById('file');
const globalLayer = document.getElementById('globalLayer');
const globalLayerWrap = document.getElementById('globalLayerWrap');

// Global layer picker: apply to every .trglyph card that has that layer.
globalLayer.addEventListener('change', () => {
	const g = globalLayer.value;
	for (const e of cards) {
		if (!e.model.isTR) continue;
		if (!g) renderCard(e, e.model.layers[0].name);
		else if (e.model.layers.some(L => L.name === g)) renderCard(e, g);
		// If this file lacks the chosen layer, leave it on its current one.
	}
});

// ---------------------------------------------------------------
// Each file is treated as a standalone image — no outside references.
// Two formats are auto-detected by content:
//   UFO .glif      -> <glyph><outline><contour><point>
//   FontRig .trglyph -> <glyph><layer><shape><contour><node>
// ---------------------------------------------------------------
function parseGlyphRoot(xml) {
	const doc = new DOMParser().parseFromString(xml, 'text/xml');
	if (doc.querySelector('parsererror')) throw new Error('XML parse error');
	const g = doc.querySelector('glyph');
	if (!g) throw new Error('no <glyph> element');
	return g;
}

function buildGlyph(xml) {
	const g = parseGlyphRoot(xml);
	return g.querySelector(':scope > layer') ? buildTrglyph(g) : buildGlif(g);
}

// -- UFO .glif ---------------------------------------------------
function buildGlif(g) {
	const unicodes = [...g.querySelectorAll('unicode')]
		.map(u => u.getAttribute('hex')).filter(Boolean);
	const adv = g.querySelector('advance');
	const advance = adv ? parseFloat(adv.getAttribute('width') || '0') : null;

	const pts = [];
	let d = '', contourCount = 0;
	for (const c of g.querySelectorAll('outline > contour')) {
		const cp = [...c.querySelectorAll('point')].map(p => ({
			x: parseFloat(p.getAttribute('x')),
			y: parseFloat(p.getAttribute('y')),
			type: p.getAttribute('type') || 'offcurve',
		}));
		if (!cp.length) continue;
		const seg = contourToPath(cp);
		if (seg) { d += seg + ' '; contourCount++; for (const p of cp) pts.push([p.x, p.y]); }
	}
	const components = g.querySelectorAll('outline > component').length;
	const warnings = components ? [`+${components} component(s) not rendered`] : [];

	return {
		kind: 'UFO .glif', isTR: false, name: g.getAttribute('name') || '', unicodes,
		layers: [{ name: 'outline', advance, contourCount, warnings, d, pts }],
	};
}

// -- FontRig .trglyph -------------------------------------------
// Every layer (master) is parsed so a dropdown can switch between them.
// Node semantics mirror the editor's tracer:
//   on    -> line target
//   curve -> first of two cubic control points (next node is the 2nd)
//   off   -> single quadratic control point
function buildTrglyph(g) {
	const name = g.getAttribute('name') || '';
	const uni = g.getAttribute('unicodes') || '';
	const unicodes = uni ? uni.split(/[\s,]+/).filter(Boolean) : [];
	const layerEls = [...g.querySelectorAll(':scope > layer')];

	const layers = layerEls.map((el, idx) => buildTrLayer(el, idx));
	if (!layers.length) layers.push({ name: '(none)', advance: null, contourCount: 0, warnings: [], d: '', pts: [] });

	return { kind: 'FontRig .trglyph', isTR: true, name, unicodes, layers };
}

// One .trglyph layer -> { name, advance, d, pts, contourCount, warnings }.
function buildTrLayer(layer, idx) {
	const name = layer.getAttribute('name') || `layer ${idx + 1}`;
	const advance = parseFloat(layer.getAttribute('width') || '0') || null;
	const pts = [];
	let d = '', contourCount = 0, hobby = 0;

	for (const shape of layer.querySelectorAll(':scope > shape')) {
		const tx = parseTransformAttr(shape.getAttribute('transform'));
		for (const c of shape.querySelectorAll(':scope > contour')) {
			if ((c.getAttribute('kind') || 'bezier') === 'hobby') { hobby++; continue; }
			const closed = /^(True|true|1)$/.test(c.getAttribute('closed') || '');
			let nodes = [...c.querySelectorAll(':scope > node')].map(n => ({
				x: parseFloat(n.getAttribute('x') || '0'),
				y: parseFloat(n.getAttribute('y') || '0'),
				type: n.getAttribute('type') || 'on',
			}));
			if (tx) nodes = nodes.map(n => ({ ...n, x: tx[0] * n.x + tx[2] * n.y + tx[4], y: tx[1] * n.x + tx[3] * n.y + tx[5] }));
			const seg = traceNodes(nodes, closed);
			if (seg) { d += seg + ' '; contourCount++; for (const n of nodes) pts.push([n.x, n.y]); }
		}
	}

	const warnings = hobby ? [`${hobby} Hobby contour(s) skipped`] : [];
	return { name, advance, contourCount, warnings, d, pts };
}

function parseTransformAttr(str) {
	if (!str) return null;
	const m = str.match(/^matrix\(([^)]+)\)$/);
	if (!m) return null;
	const p = m[1].trim().split(/\s+/).map(parseFloat);
	return (p.length === 6 && !p.some(isNaN)) ? p : null;
}

// Trace FontRig bezier nodes into an SVG path fragment (font y-up).
function traceNodes(nodes, closed) {
	const n = nodes.length;
	if (!n) return '';
	let firstOn = 0;
	for (let j = 0; j < n; j++) if (nodes[j].type === 'on') { firstOn = j; break; }

	let d = `M ${nodes[firstOn].x} ${nodes[firstOn].y} `;
	let i = (firstOn + 1) % n, count = 0;
	while (count < n - 1) {
		const node = nodes[i];
		if (node.type === 'curve') {
			const b2 = nodes[(i + 1) % n], on = nodes[(i + 2) % n];
			d += `C ${node.x} ${node.y} ${b2.x} ${b2.y} ${on.x} ${on.y} `;
			i = (i + 2) % n; count += 2;
		} else if (node.type === 'off') {
			const on2 = nodes[(i + 1) % n];
			d += `Q ${node.x} ${node.y} ${on2.x} ${on2.y} `;
			i = (i + 1) % n; count += 1;
		} else {
			d += `L ${node.x} ${node.y} `;
		}
		i = (i + 1) % n; count++;
	}
	if (closed) d += 'Z';
	return d;
}

// Build an SVG path string (font coordinates, y-up) from one UFO contour.
function contourToPath(pts) {
	const onCurve = p => p.type !== 'offcurve';
	const open = pts[0].type === 'move';
	let seq = pts;

	if (!open) {
		// Closed: rotate so it starts on an on-curve point.
		const start = pts.findIndex(onCurve);
		if (start === -1) return '';               // all off-curve: skip (rare)
		seq = pts.slice(start).concat(pts.slice(0, start));
	}

	let d = `M ${seq[0].x} ${seq[0].y} `;
	let ctrl = [];
	const rest = seq.slice(1).concat(open ? [] : [seq[0]]); // wrap to close

	for (const p of rest) {
		if (!onCurve(p)) { ctrl.push(p); continue; }
		d += segmentTo(ctrl, p);
		ctrl = [];
	}
	if (!open) d += 'Z';
	return d;
}

// One segment ending at on-curve point `p`, using accumulated off-curve `ctrl`.
// The on-curve point's TYPE decides the curve kind — don't guess from count:
//   line   -> straight
//   curve  -> cubic Bézier (PostScript), two controls
//   qcurve -> quadratic run (TrueType): implied on-curve midpoints between
//             every pair of controls, so a 4-control arc stays round.
function segmentTo(ctrl, p) {
	if (ctrl.length === 0) return `L ${p.x} ${p.y} `;

	if (p.type === 'curve' && ctrl.length >= 2) {
		const a = ctrl[ctrl.length - 2], b = ctrl[ctrl.length - 1];
		return `C ${a.x} ${a.y} ${b.x} ${b.y} ${p.x} ${p.y} `;
	}

	if (ctrl.length === 1) return `Q ${ctrl[0].x} ${ctrl[0].y} ${p.x} ${p.y} `;

	// Quadratic run with implied midpoints (TrueType qcurve).
	let s = '';
	for (let i = 0; i < ctrl.length - 1; i++) {
		const mx = (ctrl[i].x + ctrl[i + 1].x) / 2;
		const my = (ctrl[i].y + ctrl[i + 1].y) / 2;
		s += `Q ${ctrl[i].x} ${ctrl[i].y} ${mx} ${my} `;
	}
	const last = ctrl[ctrl.length - 1];
	s += `Q ${last.x} ${last.y} ${p.x} ${p.y} `;
	return s;
}

// Render a path (font coords, y-up) + its point list into a fitted <svg>.
function renderPaths(d, pts) {
	if (!d || !pts.length) return null;
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	for (const [x, y] of pts) {
		if (x < minX) minX = x; if (x > maxX) maxX = x;
		if (y < minY) minY = y; if (y > maxY) maxY = y;
	}
	if (!isFinite(minX)) return null;

	const pad = Math.max((maxX - minX), (maxY - minY)) * 0.06 + 10;
	const vbX = minX - pad, vbW = (maxX - minX) + pad * 2;
	const vbH = (maxY - minY) + pad * 2;
	// y-flip: scale(1,-1) maps font y-up to screen y-down.
	const vbY = -(maxY) - pad;

	return `<svg viewBox="${vbX} ${vbY} ${vbW} ${vbH}" xmlns="http://www.w3.org/2000/svg">
		<g transform="scale(1,-1)">
			<path d="${d}" fill="var(--outline-fill)" stroke="var(--outline-stroke)"
			      stroke-width="1" stroke-linejoin="round" stroke-linecap="round"
			      fill-rule="nonzero" vector-effect="non-scaling-stroke"/>
		</g>
	</svg>`;
}

// ---------------------------------------------------------------
// Card building
// ---------------------------------------------------------------
// Live card registry so layers can be switched after rendering.
const cards = [];        // { model, layerName, renderEl, metaEl, selectEl, name, path }
const layerUnion = [];   // ordered unique layer names across all .trglyph cards

function makeCard(name, path, text) {
	const card = document.createElement('div');
	card.className = 'card';

	let model;
	try {
		model = buildGlyph(text);
	} catch (e) {
		card.innerHTML = `<div class="render error">${esc(e.message)}</div>` +
			`<div class="meta"><div class="fname">${esc(name)}</div>` +
			`${path && path !== name ? `<div class="fpath">${esc(path)}</div>` : ''}</div>`;
		grid.appendChild(card);
		return;
	}

	const renderEl = document.createElement('div');
	const metaEl = document.createElement('div');
	metaEl.className = 'meta';

	// Per-card layer dropdown — only for .trglyph with more than one layer.
	let selectEl = null;
	if (model.isTR && model.layers.length > 1) {
		selectEl = document.createElement('select');
		selectEl.className = 'layer-pick';
		for (const L of model.layers) {
			const o = document.createElement('option');
			o.value = L.name; o.textContent = L.name;
			selectEl.appendChild(o);
		}
	}

	const entry = { model, layerName: null, renderEl, metaEl, selectEl, name, path };
	cards.push(entry);

	// Honor the global pick when this file has that layer; else its first.
	const g = globalLayer.value;
	const initial = (g && model.layers.some(L => L.name === g)) ? g : model.layers[0].name;

	card.appendChild(renderEl);
	if (selectEl) {
		const bar = document.createElement('div');
		bar.className = 'layer-bar';
		bar.appendChild(selectEl);
		card.appendChild(bar);
		selectEl.addEventListener('change', () => renderCard(entry, selectEl.value));
	}
	card.appendChild(metaEl);
	renderCard(entry, initial);
	grid.appendChild(card);

	// Feed the global layer list.
	if (model.isTR) {
		let changed = false;
		for (const L of model.layers) if (!layerUnion.includes(L.name)) { layerUnion.push(L.name); changed = true; }
		if (changed) rebuildGlobalLayer();
	}
}

// (Re)render one card entry at the named layer.
function renderCard(entry, layerName) {
	const { model } = entry;
	const layer = model.layers.find(L => L.name === layerName) || model.layers[0];
	entry.layerName = layer.name;

	const svg = renderPaths(layer.d, layer.pts);
	entry.renderEl.className = svg ? 'render' : 'render empty';
	entry.renderEl.innerHTML = svg || 'no outline';

	const bits = [`<span class="fmt">${esc(model.kind)}</span>`];
	if (model.name) bits.push(`<span>glyph <b>${esc(model.name)}</b></span>`);
	if (layer.advance != null) bits.push(`<span>adv <b>${layer.advance}</b></span>`);
	if (model.unicodes.length) bits.push(`<span>U+${model.unicodes.map(esc).join(' U+')}</span>`);
	bits.push(`<span>${layer.contourCount} contour${layer.contourCount === 1 ? '' : 's'}</span>`);
	let meta = `<div class="info">${bits.join('')}</div>`;
	for (const w of layer.warnings) meta += `<div class="warn">${esc(w)}</div>`;

	entry.metaEl.innerHTML =
		`<div class="fname">${esc(entry.name)}</div>` +
		(entry.path && entry.path !== entry.name ? `<div class="fpath">${esc(entry.path)}</div>` : '') +
		meta;

	if (entry.selectEl) entry.selectEl.value = layer.name;
}

// Rebuild the header's global layer <select> from the union of names.
function rebuildGlobalLayer() {
	const cur = globalLayer.value;
	globalLayer.innerHTML = '<option value="">Layer: first</option>' +
		layerUnion.map(n => `<option value="${esc(n)}">Layer: ${esc(n)}</option>`).join('');
	globalLayer.value = layerUnion.includes(cur) ? cur : '';
	globalLayerWrap.hidden = layerUnion.length === 0;
}

function esc(s) {
	return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---------------------------------------------------------------
// File intake
// ---------------------------------------------------------------
let total = 0;
function addFiles(list) {
	// list: array of {name, path, file}
	const picked = list.filter(f => /\.(glif|trglyph)$/i.test(f.name));
	if (!picked.length) return;
	// Sort by path for stable, folder-like ordering.
	picked.sort((a, b) => (a.path || a.name).localeCompare(b.path || b.name));
	for (const f of picked) {
		const reader = new FileReader();
		reader.onload = () => { makeCard(f.name, f.path, reader.result); updateCount(); };
		reader.onerror = () => { makeCard(f.name, f.path, ''); };
		reader.readAsText(f.file);
		total++;
	}
	updateCount();
}

function updateCount() {
	const shown = grid.children.length;
	countEl.textContent = total ? `${shown} / ${total} file${total === 1 ? '' : 's'}` : 'no files';
}

// Plain multi-file select / file drop (browser gives only the name).
function filesFromFileList(fileList) {
	return [...fileList].map(file => ({
		name: file.name,
		path: file.webkitRelativePath || file.name,
		file,
	}));
}

// Folder drop: recurse the entry tree to recover relative paths.
function walkEntry(entry, prefix, out) {
	return new Promise(resolve => {
		if (entry.isFile) {
			entry.file(file => { out.push({ name: file.name, path: prefix + file.name, file }); resolve(); });
		} else if (entry.isDirectory) {
			const reader = entry.createReader();
			const all = [];
			const readBatch = () => reader.readEntries(entries => {
				if (!entries.length) {
					Promise.all(all.map(e => walkEntry(e, prefix + entry.name + '/', out))).then(resolve);
					return;
				}
				all.push(...entries);
				readBatch();
			});
			readBatch();
		} else resolve();
	});
}

// -- events --
document.getElementById('pick').onclick = () => fileInput.click();
fileInput.onchange = () => { addFiles(filesFromFileList(fileInput.files)); fileInput.value = ''; };

document.getElementById('clear').onclick = () => {
	grid.innerHTML = ''; total = 0;
	cards.length = 0; layerUnion.length = 0;
	rebuildGlobalLayer();
	updateCount();
};

document.getElementById('theme').onclick = () => {
	const root = document.documentElement;
	root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
};

document.getElementById('sizeRange').oninput = e => {
	document.documentElement.style.setProperty('--card', e.target.value + 'px');
};

['dragenter', 'dragover'].forEach(ev =>
	dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('hot'); }));
['dragleave', 'drop'].forEach(ev =>
	dropzone.addEventListener(ev, e => { e.preventDefault(); if (ev !== 'dragleave' || e.target === dropzone) dropzone.classList.remove('hot'); }));

dropzone.addEventListener('drop', async e => {
	const items = e.dataTransfer.items;
	// Prefer the entry API so dropped folders keep their paths.
	if (items && items.length && items[0].webkitGetAsEntry) {
		const entries = [...items].map(i => i.webkitGetAsEntry()).filter(Boolean);
		if (entries.length) {
			const out = [];
			await Promise.all(entries.map(en => walkEntry(en, '', out)));
			addFiles(out);
			return;
		}
	}
	addFiles(filesFromFileList(e.dataTransfer.files));
});

// Allow dropping anywhere on the page too.
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { if (e.target !== dropzone && !dropzone.contains(e.target)) e.preventDefault(); });
</script>
</body>
</html>
